# Hermes DB sanitization manifest — DEV → config/database/hermes_install.sql
#
# Source: archive/dev_hermes_full.sql (2026-05-16 DEV dump)
# Linked: GitHub issue #179
#
# Per-table classes:
#   seed              = keep all rows (reference catalog / shipping defaults)
#   seed_from_legacy  = use legacy hermes.sql INSERTs instead of DEV rows
#                       (legacy is already demo-sanitized for this table)
#   truncate          = keep schema, drop all rows on fresh install
#   scrub             = keep rows, rewrite specific values per `scrub_rules`
#   drop              = drop the table entirely (vestigial)
#
# Legacy source for `seed_from_legacy`: /tmp/legacy-schemas/hermes.sql
# This was downloaded from:
#   https://github.com/deeztek/Hermes-Secure-Email-Gateway/tree/master/download/hermes/mysql_schema

legacy_path: /tmp/legacy-schemas/hermes.sql

tables:

  # ============================================================================
  # SEED — keep all DEV rows as-is (reference catalogs / shipping defaults)
  # ============================================================================
  timezones:                       {class: seed}
  postscreen_access:               {class: seed}
  file_rule_components:            {class: seed}
  files:                           {class: seed}
  captcha_list:                    {class: seed}
  malware_databases:               {class: seed}
  random_words:                    {class: seed}    # 200 dictionary entries for install-script random name gen
  quotes:                          {class: seed}
  message_rules:                   {class: seed}
  malware_feed_urls:               {class: seed}
  subnet:                          {class: seed}    # used by get_relay_networks.cfm
  spam_settings:                   {class: seed}
  system_updates:                  {class: seed}
  msg_content_type:                {class: seed}
  malware_feeds_config:            {class: seed}
  ofelia_jobs:                     {class: seed}
  policy:                          {class: seed}
  spam_policies:                   {class: seed}
  encryption_settings:             {class: seed}
  user_destinations:               {class: seed}
  crontab_entries:                 {class: seed}    # legacy crontab seed (informational)
  file_types:                      {class: seed}
  malware_feeds:                   {class: seed}
  remoteauth_settings:             {class: seed}    # global defaults
  aliases:                         {class: seed}
  virtual_recipients:              {class: seed}
  intrusion_prevention_whitelist:  {class: seed}
  intrusion_prevention_jails:      {class: seed}
  intrusion_prevention_settings:   {class: seed}
  file_rules:                      {class: seed}
  pgp_keyservers:                  {class: seed}
  dns_forwarders:                  {class: seed}    # user confirmed: should be seeded

  # ============================================================================
  # SEED FROM LEGACY — use legacy hermes.sql INSERTs (already pre-sanitized)
  # ============================================================================
  # system_settings: legacy ships with demo-formatted values (postmaster@domain.tld,
  # empty passwords, serial='', etc.). The 16 keys added since legacy are handled
  # by INSERT IGNORE blocks already present in schema_updates.sql. version_no and
  # build_no are owned by the release-stamp block in schema_updates.sql.
  system_settings:
    class: seed_from_legacy
    drop_rows_with_parameter: [version_no, build_no]

  # ============================================================================
  # SCRUB — keep DEV rows, rewrite specific install-specific values
  # ============================================================================

  parameters:
    class: scrub
    scrub_rules:
      # Postfix main.cf "value" rows (legacy uses id < 100 for value rows;
      # column[1] holds the actual value, parent_name in column[14] is the directive name)
      - {match_id: 25,   set_col: 1, value: "domain.tld"}                              # myorigin value: deeztek.com -> domain.tld
      - {match_id: 26,   set_col: 1, value: "hermes.domain.tld"}                       # myhostname value: smtp-dev.deeztek.com -> hermes.domain.tld
      - {match_id: 213,  set_col: 1, value: "/etc/ssl/certs/ssl-cert-snakeoil.pem"}    # smtpd_tls_cert_file -> snakeoil
      - {match_id: 215,  set_col: 1, value: "/etc/ssl/private/ssl-cert-snakeoil.key"}  # smtpd_tls_key_file -> snakeoil
      - {match_id: 217,  set_col: 1, value: null}                                      # smtpd_tls_CAfile (snakeoil has no chain)
    drop_rows_by_id:
      - 432   # mynetworks 15.235.97.143 (DEV public IP, mail_hosting_deeztek_com)
      - 430   # mynetworks 192.168.50.0/24 (ns573364 — DEV external network)
      - 433   # mynetworks 192.168.30.0/24 (home_lan — DEV home LAN)
    # mynetworks rows that REMAIN after drops:
    #   357 = 127.0.0.1 (localhost)
    #   434 = 172.16.32.0/24 (Docker subnet — REQUIRED for inter-container comms)

  parameters2:
    class: scrub
    scrub_rules:
      # Match on (parameter, module); rewrite value2 column.
      - {match: {parameter: "jwt_secret",             module: "authelia"}, set_value2: ""}
      - {match: {parameter: "session.secret",         module: "authelia"}, set_value2: ""}
      - {match: {parameter: "storage.encryption_key", module: "authelia"}, set_value2: ""}
      - {match: {parameter: "duo.hostname",           module: "authelia"}, set_value2: ""}
      - {match: {parameter: "duo.integration_key",    module: "authelia"}, set_value2: ""}
      - {match: {parameter: "duo.secret_key",         module: "authelia"}, set_value2: ""}
      - {match: {parameter: "duo.disable",            module: "authelia"}, set_value2: "true"}
      - {match: {parameter: "server_ip",              module: "console"},  set_value2: ""}
      - {match: {parameter: "console.host",           module: "console"},  set_value2: "smtp.domain.tld"}
      - {match: {parameter: "server_domain",          module: "network"},  set_value2: "domain.tld"}
      - {match: {parameter: "server_name",            module: "network"},  set_value2: "smtp"}
      - {match: {parameter: "report_email",           module: "dmarc"},    set_value2: "dmarc@domain.tld"}
      - {match: {parameter: "report_org",             module: "dmarc"},    set_value2: "Acme"}
      - {match: {parameter: "notifier.smtp.sender",   module: "authelia"}, set_value2: "someone@domain.tld"}

  # ============================================================================
  # TRUNCATE — keep schema, empty rows
  # ============================================================================
  domains:                         {class: truncate}
  mailbox_domains:                 {class: truncate}
  mailboxes:                       {class: truncate}
  mailbox_sans:                    {class: truncate}
  mailbox_aliases:                 {class: truncate}
  recipients:                      {class: truncate}
  system_users:                    {class: truncate}    # LDAP-managed
  system_certificates:             {class: truncate}
  api_tokens:                      {class: truncate}    # install script seeds with fresh tokens
  app_passwords:                   {class: truncate}
  additional_sans:                 {class: truncate}
  user_settings:                   {class: truncate}
  user_signatures:                 {class: truncate}
  org_signatures:                  {class: truncate}
  disclaimers:                     {class: truncate}
  external_banners:                {class: truncate}
  user_vacation:                   {class: truncate}
  user_folder_shares:              {class: truncate}
  shared_mailboxes:                {class: truncate}
  shared_mailbox_permissions:      {class: truncate}
  dovecot_acl:                     {class: truncate}
  dovecot_acl_shared:              {class: truncate}
  dovecot_acl_shared_anyone:       {class: truncate}
  sieve_rules:                     {class: truncate}
  sieve_rule_actions:              {class: truncate}
  sieve_rule_conditions:           {class: truncate}
  sieve_compile_log:               {class: truncate}
  pushover_notifications:          {class: truncate}
  remoteauth_mappings:             {class: truncate}
  arc_sign:                        {class: truncate}    # install-specific ARC keys
  bcc_maps:                        {class: truncate}
  sender_login_maps:               {class: truncate}
  dkim_sign:                       {class: truncate}    # customer DKIM keys
  dkim_bypass:                     {class: truncate}
  dkim_trusted_hosts:              {class: truncate}
  dmarc_domains:                   {class: truncate}
  dns_local_records:               {class: truncate}    # customer-added
  cert_generation_queue:           {class: truncate}
  mobile_setup_tokens:             {class: truncate}
  password_reset_requests:         {class: truncate}
  scheduled_job_runs:              {class: truncate}
  user_login_history:              {class: truncate}
  fail2ban_ips:                    {class: truncate}
  quota2:                          {class: truncate}    # runtime Dovecot quota tracking
  recipient_certificates:          {class: truncate}
  recipient_keystores:             {class: truncate}
  external_recipients:             {class: truncate}
  external_recipient_certificates: {class: truncate}
  encrypted_recipients:            {class: truncate}
  ca_settings:                     {class: truncate}
  amavis_sender_bypass:            {class: truncate}    # user confirmed: customer-added
  firewall:                        {class: truncate}
  tls_policies:                    {class: truncate}
  spf_bypass:                      {class: truncate}
  wblist:                          {class: truncate}
  numbers:                         {class: truncate}    # planned helper, currently empty
  temp_table:                      {class: truncate}    # used by S/MIME cert workflow (runtime)
  senders:                         {class: truncate}    # postfix sender_canonical maps (customer)
  transport:                       {class: truncate}    # postfix transport maps (customer)

  # ============================================================================
  # DROP — vestigial tables (don't include CREATE in output)
  # ============================================================================
  temp_msg_archive:                {class: drop}    # 100K rows; already DROP'd in schema_updates.sql
  parameters_copy:                 {class: drop}    # vestigial copy of parameters
  testing:                         {class: drop}    # legacy debug table
  captcha_list_all2:               {class: drop}    # legacy CAPTCHA backup
  captcha_list_all3:               {class: drop}    # legacy CAPTCHA backup
  file_rule_components_temp:       {class: drop}    # bulk-import staging
  parameters_temp:                 {class: drop}    # bulk-import staging
  mailaddr_temp:                   {class: drop}    # bulk-import staging
  recipients_temp:                 {class: drop}    # bulk-import staging
  transport_temp:                  {class: drop}    # bulk-import staging
  domains_temp:                    {class: drop}    # bulk-import staging
  body_temp:                       {class: drop}    # bulk-import staging
  msg_cleanup_table:               {class: drop}    # vestigial msg cleanup
  msg_cleanup_table_backup:        {class: drop}    # vestigial msg cleanup backup
  postfix_queue:                   {class: drop}    # real queue in /var/spool/postfix
  tasks:                           {class: drop}    # legacy task table
  tasks2:                          {class: drop}    # legacy task table
  temp_mail_view:                  {class: drop}    # vestigial
  salt:                            {class: drop}    # user confirmed: not used
  keywords:                        {class: drop}    # user confirmed: not used
  header_checks:                   {class: drop}    # user confirmed: not used
  fetchmail:                       {class: drop}    # planned long ago, never built
  command:                         {class: drop}    # user confirmed: not used (no SQL refs)
  policy2:                         {class: drop}    # legacy policy duplicate
  searches:                        {class: drop}    # entire grepmail chain is dead code
  clients:                         {class: drop}    # user confirmed: not referenced

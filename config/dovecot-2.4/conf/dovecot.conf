## Hermes SEG Dovecot 2.4 Configuration
## Migrated from 2.3.21.1 — see docs/DOVECOT-2.4-MIGRATION.md
## Generated from official converter at https://dovecot.org/upgrader/
## with manual additions for auth, SQL, LDAP, and dict sections

# ===========================================================================
# VERSION HEADERS (required — Dovecot 2.4 refuses to start without these)
# ===========================================================================

dovecot_config_version = 2.4.2
dovecot_storage_version = 2.4.0

# ===========================================================================
# MAIL STORAGE
# ===========================================================================

mail_home = /srv/mail/%{user | domain}/%{user | username}
mail_driver = maildir
mail_path = ~/

mail_uid = 1000
mail_gid = 1000
mail_privileged_group = mail
first_valid_uid = 1000
last_valid_uid = 1000

# ===========================================================================
# PROTOCOLS
# ===========================================================================

protocols = imap pop3 submission sieve lmtp

# ===========================================================================
# LOGGING
# ===========================================================================

log_path = /logs/dovecot.log
info_log_path = /logs/dovecot-info.log
debug_log_path = /logs/dovecot-debug.log

# Debug logging (comment out for production)
log_debug = category=mail or category=auth

verbose_proctitle = yes

# ===========================================================================
# NETWORK
# ===========================================================================

listen = *
login_trusted_networks = 172.16.32.0/24

# ===========================================================================
# AUTHENTICATION (inline in 2.4 — no external conf.d files)
# ===========================================================================

auth_mechanisms = plain

# LDAP password database
# In 2.4: connection settings are global, only bind-specific settings go in passdb block
ldap_uris = ldap://hermes_ldap:389
ldap_base = ou=users,dc=hermes,dc=local

passdb ldap {
  driver = ldap
  bind = yes
  bind_userdn = cn=%{user},ou=users,dc=hermes,dc=local
  filter = (cn=%{user})
}

# SQL user database (from converter: dovecot-auth-sql.conf.ext)
sql_driver = mysql

mysql hermes_db_server {
  user = hermes
  password = bfrJJDnEb5mv8G8Is5T1
  dbname = hermes
}

userdb sql {
  driver = sql
  sql_query = SELECT '/srv/mail/%{user | domain}/%{user | username}' as home, \
    'maildir:/srv/mail/%{user | domain}/%{user | username}' as mail, \
    1000 AS uid, 1000 AS gid, \
    concat('*:bytes=', quota) AS quota_rule \
    FROM mailboxes WHERE username = '%{user}' AND active = '1'
  sql_iterate_query = SELECT username AS user FROM mailboxes
}

# ===========================================================================
# PLUGINS (global scope in 2.4)
# ===========================================================================

mail_plugins {
  mail_compress = yes
  mail_crypt = yes
  quota = yes
  quota_clone = yes
}

# Quota: use count driver (tracks in index files), mirror to quota2 table via quota_clone
quota count {
  quota_storage_size = 0
}

quota_clone {
  dict proxy {
    name = quotadict
  }
}

# Compression
mail_compress_write_method = lz4

# Mail encryption (at-rest)
crypt_global_public_key_file = /keys/ecpubkey.pem
crypt_user_key_curve = prime256v1

crypt_global_private_key main {
  crypt_private_key_file = /keys/ecprivkey.pem
}

# Sieve — global admin rules run before user rules (mandatory)
sieve_script global-before {
  type = before
  driver = file
  path = /srv/sieve/global/before.sieve
}

# Sieve — personal user rules
sieve_script personal {
  driver = file
  path = /srv/sieve/users/%{user}.sieve
}

# ===========================================================================
# DICT (quota backend — inline in 2.4)
# ===========================================================================

dict_server {
  dict quotadict {
    driver = sql
    sql_driver = mysql

    mysql hermes_db_server {
      user = hermes
      password = bfrJJDnEb5mv8G8Is5T1
      dbname = hermes
    }

    dict_map priv/quota/storage {
      sql_table = quota2
      username_field = username
      value_field bytes {
      }
    }

    dict_map priv/quota/messages {
      sql_table = quota2
      username_field = username
      value_field messages {
      }
    }
  }
}

service dict {
  user = root

  unix_listener dict {
    group = vmail
    mode = 0660
    user = vmail
  }
}

# ===========================================================================
# QUOTA WARNINGS
# ===========================================================================

quota_warning warning-1 {
  quota_storage_percentage = 99

  execute quota-warning {
    args = +99 %{user}
  }
}

quota_warning warning-2 {
  quota_storage_percentage = 95

  execute quota-warning {
    args = +95 %{user}
  }
}

quota_warning warning-3 {
  quota_storage_percentage = 80

  execute quota-warning {
    args = +80 %{user}
  }
}

quota_warning warning-4 {
  quota_storage_percentage = 100
  threshold = under

  execute quota-warning {
    args = -100 %{user}
  }
}

service quota-warning {
  executable = script /scripts/quota-warning.sh
  user = vmail

  unix_listener quota-warning {
    group = vmail
    mode = 0660
    user = vmail
  }
}

# ===========================================================================
# NAMESPACES & SPECIAL MAILBOXES
# ===========================================================================

namespace inbox {
  inbox = yes
  separator = /

  mailbox Trash {
    auto = subscribe
    quota_storage_percentage = 110
    special_use = \Trash
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Spam {
    auto = subscribe
    special_use = \Junk
  }
  mailbox Archive {
    auto = subscribe
    special_use = \Archive
  }
}

# ===========================================================================
# PROTOCOL-SPECIFIC SETTINGS
# ===========================================================================

protocol imap {
  imap_metadata = yes

  mail_plugins {
    imap_quota = yes
    mail_compress = yes
    mail_crypt = yes
    quota = yes
    quota_clone = yes
  }
}

protocol lmtp {
  mail_plugins {
    quota = yes
    quota_clone = yes
    sieve = yes
    mail_crypt = yes
  }
}

protocol sieve {
  managesieve_logout_format = bytes=%{input}/%{output}
}

protocol pop3 {
  pop3_client_workarounds = outlook-no-nuls oe-ns-eoh
  pop3_uidl_format = %{uid | substr(0, 8)}%{uidvalidity | substr(0, 8)}

  mail_plugins {
    mail_crypt = yes
  }
}

# ===========================================================================
# SERVICES
# ===========================================================================

service lmtp {
  inet_listener lmtp-listener-1 {
    port = 24
  }
}

service imap-login {
  client_limit = 1000
  process_min_avail = 1
  restart_request_count = unlimited
}

service pop3-login {
  client_limit = 1000
  process_min_avail = 1
  restart_request_count = unlimited
}

service submission-login {
  client_limit = 1000
  process_min_avail = 1
  restart_request_count = unlimited
}

service managesieve-login {
  client_limit = 1000
  process_min_avail = 1
  restart_request_count = unlimited
}

service auth {
  inet_listener auth-inet {
    port = 9587
  }
}

# ===========================================================================
# SSL/TLS (from converter: 10-ssl.conf)
# ===========================================================================

ssl = yes
ssl_cipher_list = ALL:!DH:!kRSA:!SRP:!kDHd:!DSS:!aNULL:!eNULL:!EXPORT:!DES:!3DES:!MD5:!PSK:!RC4:!ADH:!LOW@STRENGTH
ssl_min_protocol = TLSv1.2

ssl_server {
  cert_file = /etc/letsencrypt/live/smtp-dev.deeztek.com/fullchain.pem
  key_file = /etc/letsencrypt/live/smtp-dev.deeztek.com/privkey.pem
  prefer_ciphers = server
}

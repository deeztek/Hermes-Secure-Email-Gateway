## Hermes SEG Dovecot 2.4 Configuration
## Migrated from 2.3.21.1 — see docs/DOVECOT-2.4-MIGRATION.md

# Required version headers (Dovecot 2.4 refuses to start without these)
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

# ===========================================================================
# MAIL STORAGE
# ===========================================================================

mail_home = /srv/mail/%{user | domain}/%{user | username}
mail_driver = maildir
mail_path = ~/

mail_uid = 1000
mail_gid = 1000
mail_privileged_group = mail
first_valid_uid = 1000
last_valid_uid = 1000

# ===========================================================================
# PROTOCOLS
# ===========================================================================

protocols = imap pop3 submission sieve lmtp

# ===========================================================================
# LOGGING
# ===========================================================================

log_path = /logs/dovecot.log
info_log_path = /logs/dovecot-info.log
debug_log_path = /logs/dovecot-debug.log

# Debug logging (comment out for production)
log_debug = category=auth category=mail

verbose_proctitle = yes

# ===========================================================================
# NETWORK
# ===========================================================================

listen = *
login_trusted_networks = 172.16.32.0/24

# ===========================================================================
# PLUGINS (global scope in 2.4 — no plugin {} block)
# ===========================================================================

mail_plugins {
  quota = yes
  zlib = yes
  mail_crypt = yes
}

# Quota: SQL dict backend
quota = dict:Userquota::proxy::quotadict
quota_rule2 = Trash:storage=+10%%
quota_warning = storage=99%% quota-warning +99 %{user}
quota_warning2 = storage=95%% quota-warning +95 %{user}
quota_warning3 = storage=80%% quota-warning +80 %{user}
quota_warning4 = -storage=100%% quota-warning -100 %{user}

# Sieve
sieve = /srv/mail/sieve/%{user}.sieve

# Compression
zlib_save = lz4

# Mail encryption (at-rest)
mail_crypt_global_private_key = /keys/ecprivkey.pem
mail_crypt_global_public_key = /keys/ecpubkey.pem
mail_crypt_curve = prime256v1
mail_crypt_save_version = 2

# ===========================================================================
# DICT (quota backend)
# ===========================================================================

dict {
  quotadict = mysql:/etc/dovecot/dovecot-dict-sql-quota.conf
}

service dict {
  unix_listener dict {
    group = vmail
    mode = 0660
    user = vmail
  }
  user = root
}

# ===========================================================================
# QUOTA WARNING SERVICE
# ===========================================================================

service quota-warning {
  executable = script /scripts/quota-warning.sh
  user = vmail
  unix_listener quota-warning {
    group = vmail
    mode = 0660
    user = vmail
  }
}

# ===========================================================================
# PROTOCOL-SPECIFIC SETTINGS
# ===========================================================================

protocol imap {
  mail_plugins {
    imap_quota = yes
    zlib = yes
    mail_crypt = yes
  }
  imap_metadata = yes
}

protocol lmtp {
  mail_plugins {
    quota = yes
    sieve = yes
    mail_crypt = yes
  }
}

protocol sieve {
  managesieve_logout_format = bytes=%i/%o
}

protocol pop3 {
  mail_plugins {
    mail_crypt = yes
  }
  pop3_client_workarounds = outlook-no-nuls oe-ns-eoh
  pop3_uidl_format = %{uidl_md5}
}

# ===========================================================================
# NAMESPACES & SPECIAL MAILBOXES
# ===========================================================================

namespace {
  inbox = yes
  separator = /

  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Spam {
    auto = subscribe
    special_use = \Junk
  }
  mailbox Archive {
    auto = subscribe
    special_use = \Archive
  }
}

# ===========================================================================
# SERVICES
# ===========================================================================

service lmtp {
  inet_listener {
    port = 24
  }
}

service imap-login {
  process_min_avail = 1
  client_limit = 1000
  service_count = 0
}

service pop3-login {
  process_min_avail = 1
  client_limit = 1000
  service_count = 0
}

service submission-login {
  process_min_avail = 1
  client_limit = 1000
  service_count = 0
}

service managesieve-login {
  process_min_avail = 1
  client_limit = 1000
  service_count = 0
}

service auth {
  inet_listener auth-inet {
    port = 9587
  }
}

# ===========================================================================
# AUTHENTICATION
# ===========================================================================

auth_mechanisms = plain

# LDAP password database (authentication)
passdb ldap {
  ldap_urls = ldap://hermes_ldap:389
  auth_bind = yes
  auth_bind_userdn = cn=%{user},ou=users,dc=hermes,dc=local
  ldap_base = ou=users,dc=hermes,dc=local
}

# SQL user database (mailbox location, quota)
userdb sql {
  query = SELECT '/srv/mail/%{user | domain}/%{user | username}' as home, \
    'maildir:/srv/mail/%{user | domain}/%{user | username}' as mail, \
    1000 AS uid, 1000 AS gid, \
    concat('*:bytes=', quota) AS quota_rule \
    FROM mailboxes WHERE username = '%{user}' AND active = '1'
  iterate_query = SELECT username AS user FROM mailboxes
}

# ===========================================================================
# SSL/TLS
# ===========================================================================

ssl = required
ssl_server_cert_file = /etc/letsencrypt/live/smtp-dev.deeztek.com/fullchain.pem
ssl_server_key_file = /etc/letsencrypt/live/smtp-dev.deeztek.com/privkey.pem
ssl_min_protocol = TLSv1.2
ssl_cipher_list = ALL:!DH:!kRSA:!SRP:!kDHd:!DSS:!aNULL:!eNULL:!EXPORT:!DES:!3DES:!MD5:!PSK:!RC4:!ADH:!LOW@STRENGTH
ssl_server_prefer_ciphers = server

# ===========================================================================
# INCLUDES (only for files that still use the old include model)
# ===========================================================================

# Note: In 2.4, auth and SSL are configured inline above.
# The conf.d include is kept for any additional overrides.
#!include_try /etc/dovecot/conf.d/*.conf

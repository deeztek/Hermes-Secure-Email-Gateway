[global]
# Ofelia dials Postfix by container name, and :10026 offers STARTTLS with the
# console certificate. No certificate will ever carry a container name as a SAN,
# so strict verification can never succeed here and the notification is dropped
# silently -- the one mail whose job is to tell an operator something failed.
#
# skip-verify rather than plaintext: the hop stays encrypted, and this makes
# Ofelia behave like every other client on :10026. Postfix uses opportunistic
# TLS there and logs "Untrusted TLS connection established" for the same
# mismatch, so this is consistency, not a weakening.
smtp-host = hermes_postfix_dkim
smtp-port = 10026
smtp-tls-skip-verify = true
email-to = admin@domain.tld
email-from = postmaster@domain.tld
mail-only-on-error = true

[job-exec "renew-acme-certificate"]
schedule =  0 05 12 * * *
container = hermes_commandbox
command = /opt/hermes/schedule/renew_acme_certificate.sh

[job-exec "hermes-message-cleanup"]
schedule =  0 30 01 * * *
container = hermes_commandbox
command = /usr/bin/curl --silent http://localhost:8888/schedule/message_cleanup.cfm

[job-exec "hermes-update-check"]
schedule =  0 30 04 * * *
container = hermes_commandbox
command = /usr/bin/curl --silent http://localhost:8888/schedule/check_for_update.cfm

[job-exec "acme-validate-ip"]
schedule = @every 30m
container = hermes_commandbox
command = /usr/bin/curl --silent http://localhost:8888/schedule/acme_validate_ip.cfm

[job-exec "hermes-health-check-mailqueue"]
schedule = @every 15m
container = hermes_commandbox
command = /usr/bin/curl --silent http://localhost:8888/schedule/health_check_mailqueue.cfm

[job-exec "hermes-dmarc-report"]
schedule = 0 30 02 * * *
container = hermes_dmarc
command = /opt/hermes/schedule/dmarc_report_script.sh

[job-exec "hermes-authelia-log-rotate"]
schedule = 0 0 02 * * *
container = hermes_commandbox
command = /opt/hermes/schedule/rotate_authelia_logs.sh

[job-exec "hermes-quarantine-notify"]
schedule = @every 60s
container = hermes_commandbox
command = /usr/bin/curl --silent http://localhost:8888/schedule/quarantine_notify.cfm
no-overlap = true

[job-exec "hermes-process-cert-queue"]
schedule = @every 60s
container = hermes_commandbox
command = /usr/bin/curl --silent http://localhost:8888/schedule/process_cert_queue.cfm
no-overlap = true

[job-exec "hermes-fangfrisch-refresh"]
schedule = @every 10m
container = hermes_mail_filter
command = /usr/bin/fangfrisch --conf /etc/fangfrisch/fangfrisch.conf refresh

[job-exec "hermes-refresh-network-aliases"]
schedule =  0 30 03 * * *
container = hermes_commandbox
command = /usr/bin/curl --silent http://localhost:8888/schedule/refresh_network_aliases.cfm

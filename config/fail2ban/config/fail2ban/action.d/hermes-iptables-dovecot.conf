# Hermes SEG - Dovecot jail action
# Uses iptables for blocking + API call for database logging
#
# This action:
# 1. Blocks the IP using iptables (uses iptables-legacy for Docker compatibility)
# 2. Calls the Hermes API to log the ban in the database

[INCLUDES]
before = iptables-allports.conf

[Definition]

# Override actionban to also call Hermes API
actionban = <iptables> -I f2b-<name> 1 -s <ip> -j <blocktype>
            /scripts/hermes-api-notify.sh BAN <ip> MAILSERVER

# Override actionunban to also call Hermes API
actionunban = <iptables> -D f2b-<name> -s <ip> -j <blocktype>
              /scripts/hermes-api-notify.sh UNBAN <ip> MAILSERVER

[Init]
# Use DOCKER-USER chain instead of INPUT - Dovecot runs in a Docker container
# with port mapping, so traffic goes through FORWARD/DOCKER chains, not INPUT.
chain = DOCKER-USER

# The iptables binary to use is set dynamically at container startup
# by detect-iptables-backend.sh which creates hermes-iptables-dovecot.local
# Default to iptables-legacy, but .local file will override if host uses nft
iptables = iptables-legacy

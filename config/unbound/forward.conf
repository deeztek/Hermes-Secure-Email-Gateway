# Unbound DNS Resolver - Upstream Forwarders
# Hermes SEG Docker Platform
#
# This file configures upstream DNS forwarders.
# The admin UI can regenerate this file to change forwarders.
#
# Default: Cloudflare (1.1.1.1) and Google (8.8.8.8) public DNS
# To use pure recursive resolution instead, comment out or remove
# the entire forward-zone block.

forward-zone:
    name: "."
    forward-tls-upstream: no
    forward-addr: 1.1.1.1
    forward-addr: 1.0.0.1
    forward-addr: 8.8.8.8
    forward-addr: 8.8.4.4

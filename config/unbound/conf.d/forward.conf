# Unbound DNS Resolver - Upstream Forwarders
# Hermes SEG Docker Platform
#
# Forwarding is DISABLED by default. Unbound performs full recursive
# resolution, which is recommended for email servers to ensure
# reliable RBL/DNSBL lookups (public forwarders may rate-limit or
# block DNSBL queries).
#
# To enable forwarding, use the admin UI (System > DNS Resolver)
# or uncomment and configure the forward-zone block below.
#
# forward-zone:
#     name: "."
#     forward-tls-upstream: no
#     forward-addr: 1.1.1.1
#     forward-addr: 1.0.0.1
#     forward-addr: 8.8.8.8
#     forward-addr: 8.8.4.4

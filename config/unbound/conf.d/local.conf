# Unbound DNS Resolver - Local Zone Overrides
# Hermes SEG Docker Platform
#
# This file is a placeholder for local DNS overrides.
# The admin UI can regenerate this file to add custom records.
#
# Example entries:
#
# local-zone: "example.local." static
# local-data: "mail.example.local. IN A 192.168.1.10"
# local-data: "webmail.example.local. IN CNAME mail.example.local."
#
# local-zone: "internal.corp." static
# local-data: "app.internal.corp. IN A 10.0.0.50"

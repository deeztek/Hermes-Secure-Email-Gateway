# Unbound DNS Resolver - Main Configuration
# Hermes SEG Docker Platform
#
# Modular config files in /etc/unbound/conf.d/:
#   forward.conf  - Upstream DNS forwarders
#   local.conf    - Local zone overrides

server:
    # Network
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    # Access Control
    access-control: 127.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 10.0.0.0/8 allow
    access-control: 192.168.0.0/16 allow
    access-control: 0.0.0.0/0 refuse

    # DNSSEC
    auto-trust-anchor-file: "/usr/share/dns/root.key"

    # Security - Hide identity
    hide-identity: yes
    hide-version: yes

    # Security - Hardening
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-referral-path: no
    harden-algo-downgrade: no
    use-caps-for-id: no

    # Privacy
    qname-minimisation: yes

    # Performance
    num-threads: 2
    msg-cache-slabs: 4
    rrset-cache-slabs: 4
    infra-cache-slabs: 4
    key-cache-slabs: 4

    # Cache sizes
    msg-cache-size: 50m
    rrset-cache-size: 100m
    key-cache-size: 10m
    neg-cache-size: 10m

    # Cache TTL
    cache-min-ttl: 300
    cache-max-ttl: 86400
    cache-max-negative-ttl: 900

    # Prefetch
    prefetch: yes
    prefetch-key: yes

    # Logging (minimal by default - increase verbosity for debugging)
    verbosity: 1
    log-queries: no
    log-replies: no
    log-servfail: yes
    logfile: ""
    use-syslog: no
    val-log-level: 1

    # Root hints
    root-hints: "/usr/share/dns/root.hints"

    # Run as unbound user
    username: "unbound"
    directory: "/etc/unbound"
    chroot: ""

    # Misc
    do-not-query-localhost: no
    so-reuseport: yes
    edns-buffer-size: 1232

# Include modular configuration files (explicit to avoid recursive self-include)
include: "/etc/unbound/conf.d/forward.conf"
include: "/etc/unbound/conf.d/local.conf"

# Hermes Sign-Only OpenDKIM Instance (#232)
#
# Purpose: signs outbound mail at the :10026 re-injection port AFTER
# CipherMail's MIME rebuild. Sign-only mode (no verification path)
# prevents the spurious dkim=fail in Authentication-Results that
# would result if a regular sv-mode instance verified the post-body-
# modification body of inbound mail flowing through the same re-
# injection port.
#
# The primary OpenDKIM instance (opendkim.conf, socket :8891) runs
# in default sv mode and handles inbound DKIM verification at :25 and
# outbound signing at :587/:465. This sign-only secondary instance
# (socket :8892) handles ONLY the :10026 re-inject and never adds an
# Authentication-Results header.

LogWhy                  Yes
SyslogFacility          mail
Syslog                  Yes
SyslogSuccess           Yes
TemporaryDirectory      /var/tmp
UMask                   022

SoftwareHeader          Yes
OversignHeaders         From

# Sign-only mode. No verification, so no Authentication-Results gets
# added regardless of the body state at this hop.
Mode                    s

# Same key tables and trusted-hosts file as the primary instance.
KeyTable                refile:/opt/hermes/dkim/KeyTable
SigningTable            refile:/opt/hermes/dkim/SigningTable
InternalHosts           refile:/opt/hermes/dkim/TrustedHosts
ExemptDomains           refile:/opt/hermes/dkim/ExemptDomains

RequireSafeKeys         False

# Different socket and PID file from the primary instance.
Socket                  inet:8892@127.0.0.1
PidFile                 /var/run/opendkim/opendkim-sign.pid

UserID                  opendkim:opendkim

Canonicalization        relaxed/relaxed
SignatureAlgorithm      rsa-sha256

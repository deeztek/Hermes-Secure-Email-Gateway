# Hermes SEG Security Configuration
# This file controls security-sensitive features that should only be
# enabled via command line access, not through the web UI.
#
# To modify, SSH into the Docker host and edit this file:
#   nano /opt/hermes/config/security.conf
#
# Changes take effect immediately on next page load.

# Allow downloading certificate files (certificate, private key, CA chain)
# from the System Certificates page. Default: no
# WARNING: Enable only when needed, then disable after downloading.
ALLOW_CERT_DOWNLOAD=no

# Allow downloading CA certificate and private key files from the Internal CA
# page for backup purposes. Default: no
# WARNING: The private key is highly sensitive. Enable only when needed for backup.
ALLOW_CA_DOWNLOAD=no

# Allow viewing full message body content (HTML/text) in the Message History
# message viewer. When set to "no", only message headers are displayed. Default: no
ALLOW_MESSAGE_CONTENT=no

# Allow downloading individual attachments from messages in the Message History
# message viewer. When set to "no", attachments are listed but cannot be
# downloaded. Default: no
ALLOW_ATTACHMENT_DOWNLOAD=no

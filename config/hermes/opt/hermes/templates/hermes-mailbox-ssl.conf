server {
        listen 443 ssl;
        server_name hermes_server_name;
        hermes_hsts;
        keepalive_timeout   70;
        access_log /var/log/nginx/hermes_access.log;
        error_log /var/log/nginx/hermes_error.log warn;
        ssl_certificate     hermes_ssl_certificate;
        ssl_certificate_key hermes_ssl_key;
        hermes_ocsp;
        hermes_verify;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        proxy_max_temp_file_size 5120m;
        client_max_body_size 5120m;


location = /autodiscover/autodiscover.xml {
        proxy_pass http://hermes_commandbox:8888/autodiscover/autodiscover.cfm;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
}

location = /Autodiscover/Autodiscover.xml {
        proxy_pass http://hermes_commandbox:8888/autodiscover/autodiscover.cfm;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
}

location = /AutoDiscover/AutoDiscover.xml {
        proxy_pass http://hermes_commandbox:8888/autodiscover/autodiscover.cfm;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
}

location = /mail/config-v1.1.xml {
        proxy_pass http://hermes_commandbox:8888/autodiscover/autoconfig.cfm$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
}

location = /.well-known/caldav {
        return 301 https://hermes_console_host/nc/remote.php/dav/;
}

location = /.well-known/carddav {
        return 301 https://hermes_console_host/nc/remote.php/dav/;
}

location / {
        return 301 https://hermes_console_host$request_uri;
}

}


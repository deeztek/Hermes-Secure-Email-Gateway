# Admin bypass: clean path with no query string (avoids URL-encoding
# issues when auth.conf's error_page 401 builds the Authelia portal
# rd= parameter). Gated by Authelia for admins with 2FA. Internally
# proxies to NC's /login?direct=1 so the admin sees the local-NC-login
# form, bypassing OIDC auto-redirect.
#
# Why this is safe to combine with auth_request, but the parent /nc/
# block below is not: the NC URL-mangling bug (issue #209) fires on
# /nc/apps/user_oidc/code when an NC session cookie exists without an
# authenticated user. /nc/login does not go through that code path.
location = /nc-admin-login {
        include /etc/nginx/snippets/auth.conf;

        # Strip the Authelia-asserted identity headers that auth.conf set.
        # We still want auth.conf's ACCESS CONTROL (admin group + 2FA gate)
        # on this path, but we do NOT want Nextcloud to TRUST that identity:
        # the whole point of /nc-admin-login is to reach the LOCAL NC login
        # form so an operator can authenticate as the NC local admin
        # (typically a different user than their Authelia identity).
        #
        # Without these strips, user_oidc's proxy-auth mode reads
        # Remote-User and silently establishes an NC session as the
        # Authelia user, defeating the local-form login entirely (the
        # form renders but submitting it is a no-op -- you were already
        # logged in before you typed anything).
        proxy_set_header Remote-User "";
        proxy_set_header Remote-Groups "";
        proxy_set_header Remote-Name "";
        proxy_set_header Remote-Email "";

        proxy_pass http://hermes_nextcloud:80/login?direct=1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 0;
}

# Block direct access to NC's built-in admin bypass (/nc/login?direct=1).
# The only supported path to the local-NC-login form is /nc-admin-login
# above (Authelia-gated). Plain /nc/login (no query, or with non-direct
# queries like redirect_url) still passes through to NC via the prefix
# /nc/ block below — unchanged. Form submissions from the /nc-admin-login
# gated form POST to /nc/login (no query) so they're unaffected.
location = /nc/login {
        if ($arg_direct = "1") {
                return 403;
        }
        proxy_pass http://hermes_nextcloud:80/login$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 0;
}

location /nc/ {
        proxy_pass http://hermes_nextcloud:80/; #The ending / is crucial otherwise the URI prefix will not be stripped
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 0;
        # NOTE: auth.conf (Authelia proxy auth) is intentionally NOT included
        # on this prefix block. Nextcloud handles its own authentication via
        # the user_oidc plugin with Authelia as the OIDC identity provider,
        # and group enforcement is via Authelia's hermes_webmail
        # authorization_policy + LDAP group membership (cn=mailboxes).
        #
        # Root cause for keeping auth_request OFF here: NC's OIDC callback
        # handler (#209) generates a mangled Location header when an NC
        # session cookie exists without an authenticated user — turning
        # /nc/apps/user_oidc/code into /nc/index.php_oidc/code. This is a NC
        # bug (proven by reproducing with a direct curl bypassing nginx),
        # not a nginx bug, but adding auth_request to the broad /nc/ block
        # changes request timing/cookie behavior in ways that can re-expose
        # it. The preload_nc_login.cfm workaround pre-initializes the
        # session cookie BEFORE the OIDC redirect, which avoids the trigger
        # condition. Adding auth_request here would defeat that workaround.
        #
        # The exact location = /nc/login block above is safe to gate
        # because it doesn't touch the OIDC callback path.
        #
        # See GitHub issue deeztek/Hermes-Secure-Email-Gateway#205 and #209
        # for the full diagnostic history.
}




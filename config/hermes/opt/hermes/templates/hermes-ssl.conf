# Link Guard (#186) time-of-click safe-links redirect endpoint. PUBLIC: email
# recipients click these links from external mail clients, so it must NOT
# require Authelia auth (no snippets/auth.conf include). Proxies ONLY the
# public /lg/ path to the Link Guard container's public port (8894); the
# container's management API (8895, /api/*) is never exposed here.
location /lg/ {
        proxy_pass http://hermes_linkguard:8894;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 15;
        proxy_send_timeout 30;
        proxy_read_timeout 30;
        send_timeout 30;
}

location /ciphermail/ {
        hermes_fw_ciphermail
        proxy_pass https://hermes_ciphermail:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/snippets/auth.conf;
}

location /web/ {
        proxy_pass https://hermes_ciphermail:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Nextcloud Maintenance Mode (#262) -- there is intentionally NO
# /nc-admin-login bypass URL. Local NC admin access is via the
# "Nextcloud Maintenance Mode" card on Email Server > Settings:
# the admin clicks "Enter Maintenance Mode", which runs
# `occ app:disable user_oidc` from the admin UI, then logs into
# /nc/ with the local NC admin credentials. Earlier attempts at a
# permanent bypass URL were architecturally infeasible -- the
# Authelia session created by the gate enabled user_oidc silent
# re-auth, overriding the form-submitted local-admin session.

# #209 cold-entry recovery: hitting /nc/ directly (without first priming the
# NC session cookie via the console's Webmail link) makes Nextcloud mangle its
# OIDC URL, turning /nc/apps/user_oidc/<x> into /nc/index.php_oidc/<x> (a 404).
# That mangled prefix is NEVER a legitimate path, so we catch it and send the
# user to the User Console instead of dead-ending on "Page not found". The
# console is the canonical hub; from there the Webmail link re-enters webmail
# via the cookie-primed preload flow with a clean state (more robust than
# trying to salvage the already-mangled OIDC request).
location ^~ /nc/index.php_oidc/ {
        return 302 /users/;
}

location /nc/ {
        proxy_pass http://hermes_nextcloud:80/; #The ending / is crucial otherwise the URI prefix will not be stripped
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 0;
        # NOTE: auth.conf (Authelia proxy auth) is intentionally NOT included
        # on this prefix block. Nextcloud handles its own authentication via
        # the user_oidc plugin with Authelia as the OIDC identity provider,
        # and group enforcement is via Authelia's hermes_webmail
        # authorization_policy + LDAP group membership (cn=mailboxes).
        #
        # Root cause for keeping auth_request OFF here: NC's OIDC callback
        # handler (#209) generates a mangled Location header when an NC
        # session cookie exists without an authenticated user — turning
        # /nc/apps/user_oidc/code into /nc/index.php_oidc/code. This is a NC
        # bug (proven by reproducing with a direct curl bypassing nginx),
        # not a nginx bug, but adding auth_request to the broad /nc/ block
        # changes request timing/cookie behavior in ways that can re-expose
        # it. The preload_nc_login.cfm workaround pre-initializes the
        # session cookie BEFORE the OIDC redirect, which avoids the trigger
        # condition. Adding auth_request here would defeat that workaround.
        #
        # The exact location = /nc/login block above is safe to gate
        # because it doesn't touch the OIDC callback path.
        #
        # See GitHub issue deeztek/Hermes-Secure-Email-Gateway#205 and #209
        # for the full diagnostic history.
}




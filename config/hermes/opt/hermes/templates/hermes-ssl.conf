# HTTP server block for ACME challenge validation and HTTPS redirect
server {
        #LISTEN CONFIG
        listen      80 default_server;
        keepalive_timeout   70;
        #LOGS CONFIG
        access_log /var/log/nginx/hermes_access.log;
        error_log /var/log/nginx/hermes_error.log warn;
        proxy_max_temp_file_size 5120m;
        client_max_body_size 5120m;
        #set_real_ip_from 192.168.XXX.XXX/24;
        #real_ip_header X-Forwarded-For;
        #real_ip_recursive on;
        # Set the .well-known directory alias for ACME certificate validation
        location /.well-known {
        root /var/www/html/;
        }
        #REDIRECT TO HTTPS
        location / {
        return 301 https://$host$request_uri;
        }
}

server {
        #LISTEN CONFIG
        listen 443 ssl;
        server_name hermes_server_name;
        #HSTS CONFIG UNCOMMENT BELOW TO ENABLE
        hermes_hsts;
        keepalive_timeout   70;
        #LOGS CONFIG
        access_log /var/log/nginx/hermes_access.log;
        error_log /var/log/nginx/hermes_error.log warn;

        #SSL LETS ENCRYPT CERTIFICATE CONFIG
        ssl_certificate     hermes_ssl_certificate;
        ssl_certificate_key hermes_ssl_key;
        # Turn on OCSP stapling as recommended at
        # https://community.letsencrypt.org/t/integration-guide/13123
        # requires nginx version >= 1.3.7
        hermes_ocsp;
        hermes_verify;
        # maintain the .well-known directory alias for Lets Encrypt Certificate Renewals
        location /.well-known {
        root /var/www/html/;
        }
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        proxy_max_temp_file_size 5120m;
        client_max_body_size 5120m;
        #set_real_ip_from 192.XXX.XXX.XXX/24;
        #real_ip_header X-Forwarded-For;
        #real_ip_recursive on;
        include /etc/nginx/snippets/authelia.conf; # Authelia auth endpoint
        #root /var/www/html;
        #index index.cfm;


location / {
        set $upstream_authelia http://hermes_authelia:9091;
        proxy_pass $upstream_authelia;
        client_body_buffer_size 128k;

        #Timeout if the real server is dead
        proxy_next_upstream error timeout invalid_header http_500 http_502     http_503;

        # Advanced Proxy Config
        send_timeout 5m;
        proxy_read_timeout 360;
        proxy_send_timeout 360;
        proxy_connect_timeout 360;

        # Basic Proxy Config
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_redirect  http://  $scheme://;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_bypass $cookie_session;
        proxy_no_cache $cookie_session;
        proxy_buffers 64 256k;

        # If behind reverse proxy, forwards the correct IP
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.0.0.0/8;
        set_real_ip_from 192.168.0.0/16;
        set_real_ip_from fc00::/7;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;
    }



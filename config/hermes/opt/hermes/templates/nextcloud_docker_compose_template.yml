services:

  hermes_nextcloud_redis:
    image: redis
    container_name: hermes_nextcloud_redis
    logging:
      options:
        max-size: 10m
    volumes:
      - redis:/var/lib/redis
    command: redis-server --requirepass $REDIS_PASSWORD
    restart: unless-stopped
    ports:
      - 8081:80
  hermes_nextcloud:
    image: nextcloud:latest
    container_name: hermes_nextcloud
    logging:
      options:
        max-size: 10m

    volumes:
      - nextcloud:/var/www/html
#Uncomment and then uncomment and set smb connection parameters under the volumes section below
      #- smb:/mnt/smb

    environment:
      - TZ=${TIMEZONE}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - REDIS_HOST=hermes_nextcloud_redis
      - REDIS_HOST_PASSWORD=${REDIS_PASSWORD}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_TRUSTED_DOMAINS}
      - OVERWRITEPROTOCOL=https
      #- APACHE_DISABLE_REWRITE_IP=1
#Uncomment and set to Traefik IP range
      - TRUSTED_PROXIES=${TRUSTED_PROXIES}
    depends_on:
      - hermes_nextcloud_redis
    restart: unless-stopped

volumes:

  redis:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: NEXTCLOUDDATAPATH/nextcloud/redis

  nextcloud:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: NEXTCLOUDDATAPATH/nextcloud/data


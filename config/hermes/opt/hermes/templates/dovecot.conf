## Hermes SEG Dovecot 2.4 Configuration Template
## DO NOT EDIT THIS FILE DIRECTLY — it is overwritten by the regenerator.
## Modify settings via Email Server > Settings in the admin console.
## Regenerator: /admin/2/inc/generate_dovecot_configuration.cfm

# ===========================================================================
# VERSION HEADERS (required — Dovecot 2.4 refuses to start without these)
# ===========================================================================

dovecot_config_version = 2.4.2
dovecot_storage_version = 2.4.0

# ===========================================================================
# MAIL STORAGE
# ===========================================================================

mail_home = /srv/mail/%{user | domain}/%{user | username}
mail_driver = maildir
mail_path = ~/

mail_uid = 1000
mail_gid = 1000
mail_privileged_group = mail
first_valid_uid = 1000
last_valid_uid = 1000

# ===========================================================================
# PROTOCOLS
# ===========================================================================

protocols = hermes_protocols

# ===========================================================================
# LOGGING
# ===========================================================================

log_path = /logs/dovecot.log
info_log_path = /logs/dovecot-info.log
debug_log_path = /logs/dovecot-debug.log

hermes_log_debug_line

verbose_proctitle = yes

# ===========================================================================
# NETWORK
# ===========================================================================

listen = *
login_trusted_networks = 172.16.32.0/24

# ===========================================================================
# AUTHENTICATION (inline in 2.4 — no external conf.d files)
# ===========================================================================

auth_mechanisms = plain

# LDAP password database
# In 2.4: connection settings are global, only bind-specific settings go in passdb block
ldap_uris = hermes_ldap_uri
ldap_base = hermes_ldap_base

passdb ldap {
  driver = ldap
  bind = yes
  bind_userdn = cn=%{user},hermes_ldap_base
  filter = (cn=%{user})
}

# SQL user database (from converter: dovecot-auth-sql.conf.ext)
sql_driver = mysql

mysql hermes_db_server {
  user = hermes_db_username
  password = hermes_db_password
  dbname = hermes
}

userdb sql {
  driver = sql
  sql_query = SELECT '/srv/mail/%{user | domain}/%{user | username}' as home, \
    'maildir:/srv/mail/%{user | domain}/%{user | username}' as mail, \
    1000 AS uid, 1000 AS gid, \
    concat('*:bytes=', quota) AS quota_rule \
    FROM mailboxes WHERE username = '%{user}' AND active = '1'
  sql_iterate_query = SELECT username AS user FROM mailboxes
}

# ===========================================================================
# PLUGINS (global scope in 2.4)
# ===========================================================================

mail_plugins {
  mail_compress = hermes_mail_compress
  mail_crypt = hermes_mail_crypt
  quota = yes
  quota_clone = yes
}

# Quota: use count driver (tracks in index files), mirror to quota2 table via quota_clone
quota count {
  quota_storage_size = 0
}

quota_clone {
  dict proxy {
    name = quotadict
  }
}

# Compression
mail_compress_write_method = hermes_compress_method
hermes_compress_level_line

# Mail encryption (at-rest)
crypt_global_public_key_file = /keys/ecpubkey.pem
crypt_user_key_curve = hermes_crypt_curve

crypt_global_private_key main {
  crypt_private_key_file = /keys/ecprivkey.pem
}

# Sieve — global admin rules run before user rules (mandatory)
sieve_script global-before {
  type = before
  driver = file
  path = /srv/sieve/global/before.sieve
}

# Sieve — personal user rules
sieve_script personal {
  driver = file
  path = /srv/sieve/users/%{user}.sieve
}

# Vacation auto-reply outbound. Pigeonhole's vacation action defaults to
# shelling out to /usr/sbin/sendmail, which doesn't exist in this Dovecot
# container. Point sieve at Postfix port 25 (regular SMTP, not 587
# submission - submission expects auth, port 25 accepts unauth relay from
# mynetworks which includes 172.16.32.0/24).
#
# submission_host is the documented Pigeonhole directive used for sieve
# rejects, redirects, and vacation auto-replies.
submission_host = hermes_postfix_dkim:25
postmaster_address = postmaster@%d
sieve_vacation_send_from_recipient = yes

# ===========================================================================
# DICT (quota backend — inline in 2.4)
# ===========================================================================

dict_server {
  dict quotadict {
    driver = sql
    sql_driver = mysql

    mysql hermes_db_server {
      user = hermes_db_username
      password = hermes_db_password
      dbname = hermes
    }

    dict_map priv/quota/storage {
      sql_table = quota2
      username_field = username
      value_field bytes {
      }
    }

    dict_map priv/quota/messages {
      sql_table = quota2
      username_field = username
      value_field messages {
      }
    }
  }
}

service dict {
  user = root

  unix_listener dict {
    group = vmail
    mode = 0660
    user = vmail
  }
}

# ===========================================================================
# QUOTA WARNINGS
# ===========================================================================

quota_warning warning-1 {
  quota_storage_percentage = hermes_quota_warn_critical

  execute quota-warning {
    args = +hermes_quota_warn_critical %{user}
  }
}

quota_warning warning-2 {
  quota_storage_percentage = hermes_quota_warn_high

  execute quota-warning {
    args = +hermes_quota_warn_high %{user}
  }
}

quota_warning warning-3 {
  quota_storage_percentage = hermes_quota_warn_medium

  execute quota-warning {
    args = +hermes_quota_warn_medium %{user}
  }
}

quota_warning warning-4 {
  quota_storage_percentage = 100
  threshold = under

  execute quota-warning {
    args = -100 %{user}
  }
}

service quota-warning {
  executable = script /scripts/quota-warning.sh
  user = vmail

  unix_listener quota-warning {
    group = vmail
    mode = 0660
    user = vmail
  }
}

# ===========================================================================
# NAMESPACES & SPECIAL MAILBOXES
# ===========================================================================

namespace inbox {
  inbox = yes
  separator = /

  mailbox Trash {
    auto = subscribe
    quota_storage_percentage = hermes_trash_quota_pct
    special_use = \Trash
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Spam {
    auto = subscribe
    special_use = \Junk
  }
  mailbox Archive {
    auto = subscribe
    special_use = \Archive
  }
}

# ===========================================================================
# PROTOCOL-SPECIFIC SETTINGS
# ===========================================================================

protocol imap {
  imap_metadata = yes
  mail_max_userip_connections = hermes_max_userip

  mail_plugins {
    imap_quota = yes
    mail_compress = hermes_mail_compress
    mail_crypt = hermes_mail_crypt
    quota = yes
    quota_clone = yes
  }
}

protocol lmtp {
  mail_plugins {
    quota = yes
    quota_clone = yes
    sieve = yes
    mail_crypt = hermes_mail_crypt
  }
}

protocol sieve {
  managesieve_logout_format = bytes=%{input}/%{output}
}

protocol pop3 {
  pop3_client_workarounds = outlook-no-nuls oe-ns-eoh
  pop3_uidl_format = %{uid | substr(0, 8)}%{uidvalidity | substr(0, 8)}
  mail_max_userip_connections = hermes_max_userip

  mail_plugins {
    mail_crypt = hermes_mail_crypt
  }
}

# ===========================================================================
# SERVICES
# ===========================================================================

service lmtp {
  inet_listener lmtp-listener-1 {
    port = 24
  }
}

service imap-login {
  client_limit = hermes_login_client_limit
  process_min_avail = 1
  restart_request_count = unlimited
}

service pop3-login {
  client_limit = hermes_login_client_limit
  process_min_avail = 1
  restart_request_count = unlimited
}

service submission-login {
  client_limit = hermes_login_client_limit
  process_min_avail = 1
  restart_request_count = unlimited
}

service managesieve-login {
  client_limit = hermes_login_client_limit
  process_min_avail = 1
  restart_request_count = unlimited
}

service auth {
  inet_listener auth-inet {
    port = 9587
  }
}

# ===========================================================================
# SSL/TLS (from converter: 10-ssl.conf)
# ===========================================================================

ssl = yes
ssl_cipher_list = hermes_ssl_cipher_list
ssl_min_protocol = hermes_ssl_min_protocol

ssl_server {
  cert_file = hermes_ssl_cert_path
  key_file = hermes_ssl_key_path
  prefer_ciphers = server
}

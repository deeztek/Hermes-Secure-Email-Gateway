<!DOCTYPE html>
<!--
  Hermes SEG public landing page.
  Served by nginx for the bare "/" path only (location = /), with NO Authelia
  auth. Built primarily for end users: the User Console is the prominent hero
  card; the Admin Console is a deliberately secondary link (admins know where
  to go). The Authelia login flow lives at /auth (the 401 / ?flow= / ?rd=
  redirect target), so this page never intercepts authentication.
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Hermes Secure Email Gateway</title>
    <link rel="icon" href="/dist/img/favicon.ico">
    <style>
        :root { --orange: #f7941e; --orange-dark: #e07d05; --ink: #2d3748; --muted: #718096; --line: #e2e8f0; }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9eef3 100%);
            color: var(--ink);
            display: flex; align-items: center; justify-content: center;
            padding: 24px;
        }
        .wrap { width: 100%; max-width: 460px; text-align: center; }
        .logo { width: 168px; max-width: 60%; height: auto; margin-bottom: 6px; }
        .tagline { color: var(--muted); margin: 0 0 28px; font-size: 0.95rem; }

        /* Hero: User Console */
        a.hero {
            display: block; text-decoration: none; color: inherit;
            background: #fff; border-radius: 18px; padding: 36px 32px;
            border: 1px solid var(--line);
            box-shadow: 0 10px 40px rgba(45, 55, 72, 0.12);
            transition: transform .1s ease, box-shadow .2s ease, border-color .2s ease;
        }
        a.hero:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 48px rgba(247, 148, 30, 0.25);
            border-color: var(--orange);
        }
        .hero .icon {
            width: 64px; height: 64px; margin: 0 auto 16px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(247, 148, 30, 0.12); color: var(--orange);
            border-radius: 50%; font-size: 30px;
        }
        .hero h1 { font-size: 1.5rem; font-weight: 700; margin: 0 0 8px; }
        .hero p { color: var(--muted); margin: 0 0 24px; font-size: 0.95rem; line-height: 1.5; }
        .hero .cta {
            display: inline-block; background: var(--orange); color: #fff;
            font-weight: 600; font-size: 1rem; padding: 12px 28px; border-radius: 10px;
            box-shadow: 0 4px 14px rgba(247, 148, 30, 0.4);
        }
        a.hero:hover .cta { background: var(--orange-dark); }

        /* Secondary: Admin */
        .admin { margin-top: 26px; font-size: 0.9rem; }
        .admin a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 1px; }
        .admin a:hover { color: var(--orange-dark); border-color: var(--orange); }

        footer { margin-top: 30px; font-size: 0.78rem; color: var(--muted); }
    </style>
</head>
<body>
    <main class="wrap">
        <img class="logo" src="/dist/img/hermes_logo_new_orange2.png" alt="Hermes Secure Email Gateway">
        <p class="tagline">Secure Email Gateway</p>

        <a class="hero" href="/users/">
            <div class="icon">&#9993;</div>
            <h1>User Console</h1>
            <p>For mailbox and relay users &mdash; review quarantined mail, manage your account &amp; security, and access webmail (mailbox users).</p>
            <span class="cta">Open User Console &rarr;</span>
        </a>

        <p class="admin">Administrator? <a href="/admin/">Sign in to the Admin Console &rarr;</a></p>

        <footer>Hermes Secure Email Gateway</footer>
    </main>
</body>
</html>

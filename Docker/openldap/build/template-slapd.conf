####################################################################
# Global Module and Schema Includes
####################################################################

# Load schema first
include /usr/local/etc/openldap/schema/core.schema
include /usr/local/etc/openldap/schema/cosine.schema
include /usr/local/etc/openldap/schema/nis.schema
include /usr/local/etc/openldap/schema/inetorgperson.schema
include /usr/local/etc/openldap/schema/remoteauth.schema

# Then specify module path and modules
modulepath /usr/local/libexec/openldap
moduleload back_mdb.la
moduleload argon2.la
moduleload remoteauth.la

# Make ARGON2 the default password scheme if desired
password-hash {ARGON2}

pidfile     /var/run/slapd/slapd.pid
argsfile    /var/run/slapd/slapd.args

####################################################################
# 1. Configuration (cn=config) Database
#    Grants EXTERNAL (root) full manage rights for ldapi:///
####################################################################

database        config
rootdn          cn=config
access to *
  by dn.exact="gidNumber=0+uidNumber=0,cn=peercred,cn=external,cn=auth" manage
  by * none

####################################################################
# 2. Main MDB Database
####################################################################

database        mdb
maxsize         1073741824
suffix          dc=PLACEHOLDER_DOMAIN
directory       /var/lib/ldap/PLACEHOLDER_DOMAIN
rootdn          cn=PLACEHOLDER_ADMIN_DN

# Indexes for better lookup performance
index objectClass eq
index uid,uidNumber,gidNumber,memberUid eq
index cn,sn,mail eq,sub

####################################################################
# 3. Access Controls for the MDB Database
#    Allows EXTERNAL root manage access during container init
#    (e.g. when using ldapmodify -Y EXTERNAL over ldapi)
####################################################################

access to *
  by dn.exact="gidNumber=0+uidNumber=0,cn=peercred,cn=external,cn=auth" manage
  by * none

####################################################################
# 4. Optional Overlays
####################################################################




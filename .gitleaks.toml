# Gitleaks configuration for Hermes SEG
# https://github.com/gitleaks/gitleaks

title = "Hermes SEG Secret Detection"

[extend]
# Use the default gitleaks config as base
useDefault = true

# Custom rules for Hermes-specific secrets
[[rules]]
id = "hermes-database-password"
description = "Database password in config files"
regex = '''(?i)(mysql_password|db_password|database_password)\s*=\s*['"][^'"]+['"]'''
secretGroup = 0
entropy = 3.0
keywords = ["mysql_password", "db_password", "database_password"]

[[rules]]
id = "hermes-ldap-password"
description = "LDAP password in code"
regex = '''(?i)password\s*=\s*"[a-zA-Z0-9!@#$%^&*()]{8,}"'''
secretGroup = 0
entropy = 3.5
keywords = ["password"]
[rules.allowlist]
regexes = [
    '''password\s*=\s*"PASSWORD"''',
    '''password\s*=\s*"PASS_WORD"''',
    '''password\s*=\s*"YOUR_PASSWORD"''',
    '''password\s*=\s*"\$'''
]

[[rules]]
id = "hermes-encryption-key"
description = "Encryption key file content"
regex = '''[a-f0-9]{64,}'''
entropy = 4.0
path = '''(?i)\.key$'''

[[rules]]
id = "hermes-api-key"
description = "API key pattern"
regex = '''(?i)(api[_-]?key|apikey)\s*[=:]\s*['"]?[a-zA-Z0-9_-]{20,}['"]?'''
secretGroup = 0
entropy = 3.0
keywords = ["api_key", "apikey"]
[rules.allowlist]
regexes = [
    '''YOUR-API-KEY''',
    '''api_key\s*=\s*$''',
    '''apikey\s*=\s*$'''
]

[[rules]]
id = "hermes-private-key"
description = "Private key in file"
regex = '''-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'''
keywords = ["BEGIN", "PRIVATE", "KEY"]

[[rules]]
id = "hermes-ip-internal"
description = "Internal IP address (192.168.x.x)"
regex = '''192\.168\.\d{1,3}\.\d{1,3}'''
entropy = 0
[rules.allowlist]
paths = [
    '''README''',
    '''\.md$''',
    '''view_intrusion_prevention\.cfm''',
    '''fail2ban'''
]

# Paths to exclude from scanning
[allowlist]
description = "Global allowlist"
paths = [
    # Template files with placeholder values
    '''Docker/common/opt/hermes/templates/''',
    '''config/hermes/opt/hermes/templates/''',

    # Plugin/vendor files
    '''plugins/''',
    '''node_modules/''',

    # Documentation
    '''\.md$''',
    '''README''',
    '''RELEASE-NOTES''',

    # Lock files
    '''package-lock\.json''',
    '''yarn\.lock''',

    # Generated map files
    '''\.map$''',

    # Fail2ban default configs (not our secrets)
    '''config/fail2ban/config/fail2ban/action\.d/''',
    '''config/fail2ban/config/fail2ban/jail\.conf''',

    # Test/example files
    '''test/''',
    '''tests/''',
    '''\.example'''
]

# Files that are already gitignored but might be in git history
regexes = [
    '''config/certbot/''',
    '''config/authelia/''',
    '''config/hermes/opt/hermes/keys/''',
    '''config/hermes/opt/hermes/ssl/''',
    '''config/hermes/opt/hermes/CA/''',
    '''schedule/.*_ad_tasks\.cfm''',
    '''\.env$'''
]
